[workspace]
members = ["crates/*"]
exclude = ["patches/iceberg-rust"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
arrow-array = "=59.2.0"
arrow-ipc = "=59.2.0"
arrow-buffer = "=59.2.0"
arrow-select = "=59.2.0"
arrow-csv = "=59.2.0"
arrow-json = "=59.2.0"
arrow-schema = "=59.2.0"
datafusion-common = "=55.0.0"
datafusion-datasource = { version = "=55.0.0", default-features = false }
datafusion-datasource-csv = "=55.0.0"
datafusion-datasource-json = "=55.0.0"
datafusion-execution = "=55.0.0"
datafusion-expr = "=55.0.0"
datafusion-functions-nested = "=55.0.0"
datafusion-functions = "=55.0.0"
datafusion-physical-expr = "=55.0.0"
datafusion-physical-plan = "=55.0.0"
futures = "0.3"
pyo3 = "=0.29.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
