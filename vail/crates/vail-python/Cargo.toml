[package]
name = "vail-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
futures.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
pyo3 = { workspace = true, features = ["abi3-py311"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
vail-execution = { path = "../vail-execution" }
vail-storage = { path = "../vail-storage" }
vail-table = { path = "../vail-table" }
