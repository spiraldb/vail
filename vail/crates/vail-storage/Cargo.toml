[package]
name = "vail-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
futures = "0.3"
iceberg = { path = "../../patches/iceberg-rust/crates/iceberg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "macros"] }
uuid = { version = "1", features = ["v7"] }
vortex = { version = "=0.86.1", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
vail-execution = { path = "../vail-execution" }
