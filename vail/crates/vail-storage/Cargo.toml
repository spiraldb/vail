[package]
name = "vail-storage"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
arrow-ipc = "=59.2.0"
async-stream = "0.3"
arrow-cast = "=59.2.0"
tempfile = "3"
arrow-array = "=59.2.0"
arrow-data = "=59.2.0"
arrow-schema = { version = "=59.2.0", features = ["serde"] }
arrow-ord = "=59.2.0"
futures = "0.3"
iceberg = { path = "../../patches/iceberg-rust/crates/iceberg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "macros", "sync"] }
uuid = { version = "1", features = ["v7"] }
vail-execution = { path = "../vail-execution" }
vortex = { version = "=0.86.1", features = ["tokio"] }

arrow-select = "=59.2.0"
arrow-buffer = "=59.2.0"
flate2 = "1"
lz4_flex = "0.13"
zstd = "0.13"

[dev-dependencies]
datafusion-common.workspace = true
vail-ordering = { path = "../vail-ordering" }
